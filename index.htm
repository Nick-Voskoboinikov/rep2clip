
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22&gt;&lt;text y=%22.9em%22 font-size=%2290%22&gt;&#9999;&#65039;&lt;/text&gt;&lt;/svg&gt;">
    <title>Для отчёта в чат</title>
    <link rel="stylesheet" href="styles/style.css" >
</head>
<body>
    <main>
    <div id="form" data-memsnum="0">
        

<h2>Для отчёта в чат</h2>
  <fieldset><legend>За период</legend>
  <input type="radio" name="period" id="forStrictDate" checked >&nbsp;&nbsp;&nbsp;<label for="forStrictDate">За сегодня</label><br>
  <input type="radio" name="period" id="forInterMed" >&nbsp;&nbsp;&nbsp;<label for="forInterMed">Промежуточная статистика</label><br>
  <div id="interMedStatSumField" ><input type="text" inputmode="numeric" id="kioskPreSum" name="kioskPreSum" pattern="^[\d\.\s]+$" placeholder="Киоск, суммы чеков через пробел" value=""></div>
  <input type="radio" name="period" id="forThisNight" >&nbsp;&nbsp;&nbsp;<label for="forThisNight">За ночь</label>
  </fieldset><br>
  <table>
    <tr style="display: none;" ><td><label for="kioskSum">Киоск, выручка</label>:
      <details><summary>i</summary><img src="img\IMG_20260725_091305_860_1.jpg" alt="Общий сменный день" style="width: 100vw;" ></details>
    </td><td><input type="text" inputmode="numeric" id="kioskSum" name="kioskSum" pattern="^\d+$" placeholder="Киоск, выручка" value="0" disabled ></td></tr>
    <tr style="display: none;" ><td><label for="kioskGuests">Киоск, люди</label>:</td><td><input type="number" inputmode="numeric" id="kioskGuests" name="kioskGuests" pattern="^\d+$" placeholder="Киоск, люди" value="0" disabled></td></tr>
    <tr><td><label for="yandexDeliveries">Яндекс-доставок</label>:
      <details><summary>i</summary><img src="img\IMG_20260725_090932_355.jpg" alt="Общий сменный день" style="width: 100vw;" ></details></td><td><input type="text" inputmode="numeric" id="yandexDeliveries" name="yandexDeliveries" pattern="^\d+$" placeholder="Яндекс-доставки" value=""></td></tr>
    <tr><td><label for="drinks">Напитки</label>:
      <details><summary>i</summary><img src="img\IMG_20260725_091250_169_1.jpg" alt="Общий сменный день" style="width: 100vw;" ></details></td><td><input type="text" inputmode="numeric" id="drinks" name="drinks" pattern="^\d+$" placeholder="Напитки" value=""></td></tr>
    <tr><td><label for="sixInchesOfTheDay">Сэндвичи дня, 15 см</label>:
      <details><summary>i</summary><img src="img\IMG_20260725_091250_169_2.png" alt="Общий сменный день" style="width: 100vw;" ></details></td><td><input type="text" inputmode="numeric" id="sixInchesOfTheDay" name="sixInchesOfTheDay" pattern="^\d+$" placeholder="Саб дня 15см" value=""></td></tr>
    <tr><td><label for="footlongsOfTheDay">Сэндвичи дня, 30 см</label>:
      <details><summary>i</summary><img src="img\IMG_20260725_091250_169_3.png" alt="Общий сменный день" style="width: 100vw;" ></details></td><td><input type="text" inputmode="numeric" id="footlongsOfTheDay" name="drinks" pattern="^\d+$" placeholder="Саб дня 30см" value=""></td></tr>
    <tr><td><label for="trio">Трио</label>:</td><td><input type="text" inputmode="numeric" id="trio" name="drinks" pattern="^\d+$" placeholder="Комбо Трио" value=""></td></tr>
    <tr><td><label for="cashierBoxSum">Касса выручка</label>:
      <details><summary>i</summary><img src="img\IMG_20260725_091241_162_1.jpg" alt="Отчёт \"Общая выручка\"" style="width: 100vw;" ></details></td><td><input type="text" inputmode="numeric" id="cashierBoxSum" name="cashierBoxSum" pattern="^\d+$" placeholder="Касса выручка" value=""></td></tr>
    <tr><td><label for="cashierBoxGuests">Касса, люди</label>:
      <details><summary>i</summary><img src="img\IMG_20260725_091241_162_2.jpg" alt="Отчёт \"Общая выручка\"" style="width: 100vw;" ></details></td><td><input type="text" inputmode="numeric" id="cashierBoxGuests" name="cashierBoxGuests" pattern="^\d+$" placeholder="Касса, люди" value=""></td></tr>
  </table>
<br>
<input type="button" id="goClip" name="goClip" onclick="goClip();" value="Скопировать для вставки в чат" >
<input type="button" onclick="reportStats();" value="Для отчётности" style="display:none;" />

    <button id="settingsBtn" style="display:none;" onmouseover="(this.querySelector('span')).style.transform='rotateX(45deg);'"><span>⚙️kk</span></button>
    </main>
    <script src="scripts/index.js"></script>
</body>
</html>
